name: Scaffold Stellar Proximology Dual Server

on:
  workflow_dispatch:   # run manually from GitHub Actions tab

jobs:
  scaffold:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── render.yaml (root) ──────────────────────────────────────────────────
      - name: Write render.yaml
        run: |
          cat > render.yaml << 'EOF'
          services:
            - type: web
              name: synthia-node
              runtime: node
              rootDir: server
              buildCommand: npm install
              startCommand: node server.js
              envVars:
                - key: NODE_ENV
                  value: production
                - key: NODE_ID
                  value: synthia-node
                - key: PYTHON_SERVICE_URL
                  value: https://synthia-python.onrender.com
                - key: SUPABASE_URL
                  sync: false
                - key: SUPABASE_KEY
                  sync: false
                - key: PORT
                  value: 3000

            - type: web
              name: synthia-python
              runtime: python
              rootDir: trident
              buildCommand: pip install -r requirements.txt
              startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
              envVars:
                - key: NODE_ID
                  value: synthia-python
                - key: GROQ_API_KEY
                  sync: false
                - key: SUPABASE_URL
                  sync: false
                - key: SUPABASE_KEY
                  sync: false
                - key: HF_TOKEN
                  sync: false
                - key: NODE_SERVICE_URL
                  value: https://synthia-node.onrender.com
          EOF

      # ── server/ Node files ──────────────────────────────────────────────────
      - name: Write server/registry.js
        run: |
          mkdir -p server
          cat > server/registry.js << 'EOF'
          const peers = new Map();

          function register(peerId, ws, meta = {}) {
            peers.set(peerId, { ws, meta, joinedAt: Date.now() });
            console.log(`[mesh] peer registered: ${peerId} | total: ${peers.size}`);
          }

          function unregister(peerId) {
            peers.delete(peerId);
            console.log(`[mesh] peer left: ${peerId} | total: ${peers.size}`);
          }

          function get(peerId) { return peers.get(peerId); }

          function list() {
            return [...peers.entries()].map(([id, p]) => ({
              id, meta: p.meta, joinedAt: p.joinedAt,
            }));
          }

          function broadcast(senderId, message) {
            let sent = 0;
            for (const [id, peer] of peers.entries()) {
              if (id === senderId) continue;
              if (peer.ws.readyState === 1) {
                peer.ws.send(JSON.stringify(message));
                sent++;
              }
            }
            return sent;
          }

          module.exports = { register, unregister, get, list, broadcast };
          EOF

      - name: Write server/signal.js
        run: |
          cat > server/signal.js << 'EOF'
          const registry = require('./registry');

          function handleSignal(senderId, message, ws) {
            const { type, target, payload } = message;
            if (!registry.get(senderId)) {
              registry.register(senderId, ws, message.meta || {});
            }
            switch (type) {
              case 'offer':
              case 'answer':
              case 'ice-candidate':
                return relay(senderId, target, { type, from: senderId, payload });
              case 'ping':
                ws.send(JSON.stringify({ type: 'pong', ts: Date.now() }));
                return;
              case 'announce':
                registry.broadcast(senderId, { type: 'peer-joined', peerId: senderId, meta: message.meta || {} });
                ws.send(JSON.stringify({ type: 'peer-list', peers: registry.list().filter(p => p.id !== senderId) }));
                return;
              case 'leave':
                registry.unregister(senderId);
                registry.broadcast(senderId, { type: 'peer-left', peerId: senderId });
                return;
              default:
                console.warn(`[signal] unknown type: ${type} from ${senderId}`);
            }
          }

          function relay(from, targetId, message) {
            if (!targetId) return registry.broadcast(from, message);
            const target = registry.get(targetId);
            if (!target) { console.warn(`[signal] relay failed — target not found: ${targetId}`); return false; }
            if (target.ws.readyState === 1) { target.ws.send(JSON.stringify(message)); return true; }
            return false;
          }

          module.exports = { handleSignal };
          EOF

      - name: Write server/mesh.js
        run: |
          cat > server/mesh.js << 'MESHEOF'
          const { createClient } = require('@supabase/supabase-js');

          const supabase = process.env.SUPABASE_URL && process.env.SUPABASE_KEY
            ? createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY)
            : null;

          class Mesh {
            constructor(nodeId) {
              this.nodeId = nodeId;
              this.connections = new Map();
              this.routes = new Map();
              this.sessionId = `session_${Date.now()}`;
              this._pulseInterval = null;
              this._handlers = new Map();
            }

            connect(nodeId, endpoint, meta = {}) {
              this.connections.set(nodeId, { endpoint, meta, lastSeen: Date.now(), healthy: true });
              console.log(`[mesh:${this.nodeId}] connected → ${nodeId} @ ${endpoint}`);
            }

            disconnect(nodeId) {
              this.connections.delete(nodeId);
              for (const [intent, target] of this.routes.entries()) {
                if (target === nodeId) this.routes.delete(intent);
              }
            }

            learn(intent, nodeId) { this.routes.set(intent, nodeId); }
            on(intent, fn) { this._handlers.set(intent, fn); }

            async route(intent, payload) {
              const target = this._resolveTarget(intent);
              if (!target || target === this.nodeId) return this.receive(this.nodeId, intent, payload);
              const peer = this.connections.get(target);
              if (!peer || !peer.healthy) return this.receive(this.nodeId, intent, payload);
              await this._logRoute(intent, target);
              return this.forward(peer.endpoint, intent, payload, target);
            }

            _resolveTarget(intent) {
              if (this.routes.has(intent)) return this.routes.get(intent);
              for (const [pattern, nodeId] of this.routes.entries()) {
                if (pattern.endsWith('*') && intent.startsWith(pattern.slice(0, -1))) return nodeId;
              }
              for (const [nodeId, peer] of this.connections.entries()) {
                if (peer.meta?.capabilities?.includes(intent)) return nodeId;
              }
              return this.nodeId;
            }

            async forward(endpoint, intent, payload, fromNode = this.nodeId) {
              const res = await fetch(`${endpoint}/mesh/receive`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ from: fromNode, intent, payload }),
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            }

            receive(from, intent, payload) {
              const handler = this._handlers.get(intent) || this._handlers.get('*');
              if (handler) return handler(from, payload);
              return { status: 'unhandled', intent, nodeId: this.nodeId };
            }

            startPulse(intervalMs = 5000) {
              if (this._pulseInterval) return;
              this._pulseInterval = setInterval(() => this._pulse(), intervalMs);
            }

            stopPulse() { clearInterval(this._pulseInterval); this._pulseInterval = null; }

            async _pulse() {
              for (const [nodeId, peer] of this.connections.entries()) {
                fetch(`${peer.endpoint}/health`, { signal: AbortSignal.timeout(3000) })
                  .then(r => { peer.healthy = r.ok; peer.lastSeen = Date.now(); })
                  .catch(() => { peer.healthy = false; });
              }
            }

            async _logRoute(intent, toNode) {
              if (!supabase) return;
              try {
                await supabase.from('mesh_routes').insert({
                  session_id: this.sessionId, from_node: this.nodeId,
                  to_node: toNode, intent, timestamp: new Date().toISOString(),
                });
              } catch (e) { console.warn('[mesh] log failed:', e.message); }
            }

            status() {
              return {
                nodeId: this.nodeId, sessionId: this.sessionId,
                peers: [...this.connections.entries()].map(([id, p]) => ({
                  id, endpoint: p.endpoint, healthy: p.healthy, lastSeen: p.lastSeen,
                  capabilities: p.meta?.capabilities || [],
                })),
                routes: Object.fromEntries(this.routes),
              };
            }
          }

          module.exports = { Mesh };
          MESHEOF

      - name: Write server/server.js
        run: |
          cat > server/server.js << 'EOF'
          const express = require('express');
          const http = require('http');
          const { WebSocketServer } = require('ws');
          const cors = require('cors');
          const { v4: uuidv4 } = require('uuid');
          const { handleSignal } = require('./signal');
          const registry = require('./registry');
          const { Mesh } = require('./mesh');

          const app = express();
          const server = http.createServer(app);
          const wss = new WebSocketServer({ server });

          const PORT = process.env.PORT || 3000;
          const PYTHON_URL = process.env.PYTHON_SERVICE_URL || 'http://localhost:8000';
          const NODE_ID = process.env.NODE_ID || 'synthia-node';

          app.use(cors());
          app.use(express.json());

          const mesh = new Mesh(NODE_ID);
          mesh.connect('synthia-python', PYTHON_URL, {
            capabilities: ['infer', 'field', 'oracle', 'trident.query', 'trident.add',
                           'collapse', 'proximity', 'gate', 'chart'],
          });
          mesh.learn('infer',       'synthia-python');
          mesh.learn('field',       'synthia-python');
          mesh.learn('oracle',      'synthia-python');
          mesh.learn('collapse',    'synthia-python');
          mesh.learn('proximity',   'synthia-python');
          mesh.learn('trident.*',   'synthia-python');
          mesh.startPulse(5000);

          app.get('/health', (req, res) => res.json({
            status: 'ok', service: 'synthia-node',
            peers: registry.list().length, ts: Date.now(),
          }));

          app.get('/mesh/status', (req, res) => res.json(mesh.status()));

          app.post('/mesh/receive', (req, res) => {
            const { from, intent, payload } = req.body;
            const result = mesh.receive(from, intent, payload);
            res.json({ status: 'ok', result });
          });

          app.post('/mesh/route', async (req, res) => {
            try {
              const result = await mesh.route(req.body.intent, req.body.payload);
              res.json({ status: 'ok', result });
            } catch (e) { res.status(502).json({ error: e.message }); }
          });

          async function callPython(path, body) {
            const res = await fetch(`${PYTHON_URL}${path}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) throw new Error(`Python ${res.status}`);
            return res.json();
          }

          app.post('/infer',   async (req, res) => { try { res.json(await callPython('/infer', req.body)); } catch(e) { res.status(502).json({error:e.message}); }});
          app.post('/field',   async (req, res) => { try { res.json(await callPython('/field', req.body)); } catch(e) { res.status(502).json({error:e.message}); }});
          app.post('/oracle',  async (req, res) => { try { res.json(await callPython('/oracle', req.body)); } catch(e) { res.status(502).json({error:e.message}); }});
          app.post('/collapse',async (req, res) => { try { res.json(await callPython('/collapse', req.body)); } catch(e) { res.status(502).json({error:e.message}); }});

          wss.on('connection', (ws) => {
            const peerId = uuidv4();
            ws._peerId = peerId;
            ws.send(JSON.stringify({ type: 'welcome', peerId }));
            ws.on('message', (raw) => {
              try { handleSignal(peerId, JSON.parse(raw), ws); }
              catch { ws.send(JSON.stringify({ type: 'error', message: 'invalid JSON' })); }
            });
            ws.on('close', () => {
              registry.unregister(peerId);
              registry.broadcast(peerId, { type: 'peer-left', peerId });
            });
          });

          server.listen(PORT, () => console.log(`[synthia-node] :${PORT} | python: ${PYTHON_URL}`));
          EOF

      - name: Update server/package.json
        run: |
          cat > server/package.json << 'EOF'
          {
            "name": "synthia-node",
            "version": "2.0.0",
            "description": "Synthia — consciousness mesh, WebRTC signaling, MCP transport",
            "main": "server.js",
            "scripts": {
              "start": "node server.js",
              "dev": "node --watch server.js"
            },
            "dependencies": {
              "express": "^4.18.2",
              "ws": "^8.16.0",
              "cors": "^2.8.5",
              "uuid": "^9.0.0",
              "@supabase/supabase-js": "^2.39.0"
            }
          }
          EOF

      # ── trident/ Python files ───────────────────────────────────────────────
      - name: Create trident directory structure
        run: mkdir -p trident/routers trident/core/trident

      - name: Write trident/requirements.txt
        run: |
          cat > trident/requirements.txt << 'EOF'
          fastapi>=0.110.0
          uvicorn[standard]>=0.27.0
          onnxruntime>=1.17.0
          numpy>=1.26.0
          huggingface-hub>=0.21.0
          groq>=0.4.0
          supabase>=2.3.0
          pyswisseph>=2.10.3.2
          python-dotenv>=1.0.0
          httpx>=0.27.0
          pydantic>=2.6.0
          EOF

      - name: Write trident/core/__init__.py
        run: touch trident/core/__init__.py

      - name: Write trident/routers/__init__.py
        run: touch trident/routers/__init__.py

      - name: Write trident/core/trident/__init__.py
        run: |
          cat > trident/core/trident/__init__.py << 'EOF'
          # Drop model.py + rag.py from stellarproximology/Trident HF repo into this folder
          EOF

      - name: Write trident/core/gate_ops.py
        run: |
          curl -sL "https://raw.githubusercontent.com/justappgrabbin/Synthia-server/main/trident/core/gate_ops.py" \
            -o trident/core/gate_ops.py 2>/dev/null || \
          python3 - << 'PYEOF'
          content = open('/dev/stdin').read() if False else """
          # gate_ops.py — see full file in this PR
          # Auto-generated placeholder — replace with full file from build artifacts
          import os, time
          from supabase import create_client
          _gates = {}
          _sb = None
          try:
              _sb = create_client(os.getenv('SUPABASE_URL',''), os.getenv('SUPABASE_KEY',''))
          except: pass
          PLANETARY_WEIGHTS = {'Sun':0.70,'Earth':0.70,'Moon':0.20,'Jupiter':0.15,'Saturn':0.15,'Mercury':0.10,'Venus':0.10,'Mars':0.10,'Uranus':0.05,'Neptune':0.04,'Pluto':0.03,'Node':0.08}
          LINE_BROADCAST_WEIGHTS = {1:0.15,2:0.25,3:0.35,4:0.55,5:0.75,6:0.90}
          def load(force=False):
              global _gates
              if not _sb: return _gates
              try:
                  res = _sb.table('gate_neural_ops').select('*').order('gate').execute()
                  _gates = {r['gate']: r for r in (res.data or [])}
              except Exception as e: print(f'[gate_ops] {e}')
              return _gates
          def get(gate_id): 
              if not _gates: load()
              return _gates.get(gate_id)
          def gates_for_field(field):
              if not _gates: load()
              return [g for g,v in _gates.items() if (v.get('field') or '').lower() == field.lower()]
          def field_resonance_weights(active_ids):
              if not _gates: load()
              scores = {f:0.0 for f in ['body','heart','spirit','mind','soul']}
              for gid in active_ids:
                  g = _gates.get(gid)
                  if g: scores[(g.get('field') or 'spirit').lower()] += 1.2 if g.get('channel_to') else 1.0
              total = sum(scores.values()) or 1.0
              return {f: round(v/total,4) for f,v in scores.items()}
          def activation_score(gate_id, planet='Sun', line=1):
              return min(1.0, PLANETARY_WEIGHTS.get(planet,0.05) * LINE_BROADCAST_WEIGHTS.get(line,0.15))
          def neural_op_for_intent(intent):
              if not _gates: load()
              if intent.startswith('gate.'):
                  try: g = _gates.get(int(intent.split('.')[1])); return g['neural_op'] if g else None
                  except: return None
              return None
          """
          with open('trident/core/gate_ops.py', 'w') as f:
              f.write(content.strip())
          PYEOF

      - name: Write trident/core/mesh.py
        run: |
          cat > trident/core/mesh.py << 'EOF'
          import os, time, asyncio, httpx
          from typing import Any, Callable, Optional
          from uuid import uuid4
          try:
              from supabase import create_client
              _sb = create_client(os.getenv('SUPABASE_URL',''), os.getenv('SUPABASE_KEY',''))
          except: _sb = None

          FUSE_WEIGHTS = {'body':0.30,'heart':0.28,'spirit':0.20,'mind':0.12,'soul':0.10}
          INTENT_FIELD = {
              'infer':'body','compute':'body','collapse':'body','address':'body',
              'oracle':'heart','channel':'heart','gate':'heart','reading':'heart',
              'trident.query':'spirit','trident.add':'spirit','rag':'spirit',
              'field':'mind','chart':'mind','sidereal':'mind','draconic':'mind','tropical':'mind','gnn':'mind',
              'mesh.sync':'soul','mesh.pulse':'soul','peer':'soul','governance':'soul',
          }

          class PeerNode:
              def __init__(self, node_id, endpoint, capabilities=None, field_affinity=None, meta=None):
                  self.node_id=node_id; self.endpoint=endpoint
                  self.capabilities=capabilities or []; self.field_affinity=field_affinity or {}
                  self.meta=meta or {}; self.healthy=True; self.last_seen=time.time()
                  self.resonance_score=1.0; self.latency_ms=0.0
              def affinity_for(self, field):
                  return self.field_affinity.get(field,0.0)*FUSE_WEIGHTS.get(field,0.1)*self.resonance_score

          class Mesh:
              def __init__(self, node_id='synthia-python'):
                  self.node_id=node_id; self.session_id=f'sess_{uuid4().hex[:8]}'
                  self.connections={}; self.routes={}; self._handlers={}
                  self._field_state={}; self._pulse_task=None
              def connect(self,node_id,endpoint,capabilities=None,field_affinity=None,meta=None):
                  self.connections[node_id]=PeerNode(node_id,endpoint,capabilities,field_affinity,meta)
              def disconnect(self,node_id):
                  self.connections.pop(node_id,None)
                  self.routes={k:v for k,v in self.routes.items() if v!=node_id}
              def learn(self,intent,node_id): self.routes[intent]=node_id
              def on(self,intent,fn): self._handlers[intent]=fn
              def set_field_state(self,fs): self._field_state=fs
              def resolve(self,intent,payload=None):
                  if intent in self.routes: return self.routes[intent]
                  for p,nid in self.routes.items():
                      if p.endswith('*') and intent.startswith(p[:-1]):
                          if nid in self.connections and self.connections[nid].healthy: return nid
                  field=INTENT_FIELD.get(intent.split('.')[0])
                  if field and self.connections:
                      best,score=None,-1.0
                      for nid,peer in self.connections.items():
                          if not peer.healthy: continue
                          s=peer.affinity_for(field)
                          if self._field_state: s*=(0.5+self._field_state.get(field,0.5))
                          if peer.latency_ms>0: s*=max(0.5,1.0-(peer.latency_ms/2000.0))
                          if s>score: score=s; best=nid
                      if best and score>0: return best
                  for nid,peer in self.connections.items():
                      if peer.healthy and intent in peer.capabilities: return nid
                  return self.node_id
              async def route(self,intent,payload=None):
                  target=self.resolve(intent,payload)
                  if target==self.node_id: return await self.receive(self.node_id,intent,payload or {})
                  peer=self.connections.get(target)
                  if not peer or not peer.healthy: return await self.receive(self.node_id,intent,payload or {})
                  await self._log_route(intent,target)
                  return await self.forward(peer.endpoint,intent,payload or {})
              async def forward(self,endpoint,intent,payload):
                  t0=time.time()
                  async with httpx.AsyncClient(timeout=10.0) as c:
                      res=await c.post(f'{endpoint}/mesh/receive',json={'from':self.node_id,'intent':intent,'payload':payload})
                      res.raise_for_status()
                      for p in self.connections.values():
                          if p.endpoint==endpoint: p.latency_ms=(time.time()-t0)*1000
                      return res.json()
              async def receive(self,from_node,intent,payload):
                  h=self._handlers.get(intent) or self._handlers.get('*')
                  if h: return await h(from_node,intent,payload) if asyncio.iscoroutinefunction(h) else h(from_node,intent,payload)
                  return {'status':'unhandled','intent':intent,'node':self.node_id}
              def start_pulse(self,interval_s=5.0):
                  async def _loop():
                      while True:
                          await asyncio.gather(*[self._check(nid,p) for nid,p in self.connections.items()],return_exceptions=True)
                          await asyncio.sleep(interval_s)
                  self._pulse_task=asyncio.create_task(_loop())
              def stop_pulse(self):
                  if self._pulse_task: self._pulse_task.cancel()
              async def _check(self,node_id,peer):
                  t0=time.time()
                  try:
                      async with httpx.AsyncClient(timeout=3.0) as c:
                          r=await c.get(f'{peer.endpoint}/health')
                          peer.healthy=r.is_success; peer.last_seen=time.time()
                          peer.latency_ms=(time.time()-t0)*1000
                          peer.resonance_score=min(1.0,max(0.1,1.0-peer.latency_ms/1000.0))
                  except: peer.healthy=False; peer.resonance_score=0.0
              async def _log_route(self,intent,to_node):
                  if not _sb: return
                  try: _sb.table('mesh_routes').insert({'session_id':self.session_id,'from_node':self.node_id,'to_node':to_node,'intent':intent,'timestamp':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}).execute()
                  except: pass
              def status(self):
                  return {'node_id':self.node_id,'session_id':self.session_id,'field_state':self._field_state,
                      'peers':[{'id':nid,'endpoint':p.endpoint,'healthy':p.healthy,'resonance':round(p.resonance_score,3),'latency_ms':round(p.latency_ms,1),'capabilities':p.capabilities,'field_affinity':p.field_affinity} for nid,p in self.connections.items()],
                      'routes':dict(self.routes),'fuse_weights':FUSE_WEIGHTS}

          _mesh=None
          def get_mesh():
              global _mesh
              if _mesh is None:
                  _mesh=Mesh(os.getenv('NODE_ID','synthia-python'))
                  _mesh.connect('synthia-node',os.getenv('NODE_SERVICE_URL','https://synthia-node.onrender.com'),
                      capabilities=['signal','peer','mesh.sync','governance','overlay'],
                      field_affinity={'soul':0.90,'spirit':0.60,'body':0.40,'heart':0.20,'mind':0.10})
                  for intent in ['infer','field','oracle','collapse','address','trident.*','gnn','chart']:
                      _mesh.learn(intent,'synthia-python')
              return _mesh
          EOF

      - name: Write trident/core/onnx_runner.py
        run: |
          cat > trident/core/onnx_runner.py << 'EOF'
          import time, numpy as np, os
          from pathlib import Path
          _sessions = {}
          MODEL_PATHS = {'synthia': os.getenv('SYNTHIA_MODEL_PATH','models/synthia.onnx'),'distilbert': os.getenv('DISTILBERT_MODEL_PATH','models/distilbert.onnx')}
          def _load(model_name):
              if model_name in _sessions: return _sessions[model_name]
              import onnxruntime as ort
              path = MODEL_PATHS.get(model_name)
              if not path or not Path(path).exists():
                  from huggingface_hub import hf_hub_download
                  repo_map = {'synthia':'stellarproximology/Synthia','distilbert':'stellarproximology/Distilbert'}
                  path = hf_hub_download(repo_id=repo_map[model_name],filename='model.onnx',token=os.getenv('HF_TOKEN'),local_dir=f'models/{model_name}')
              s = ort.InferenceSession(path, providers=['CPUExecutionProvider'])
              _sessions[model_name] = s
              return s
          class ONNXRunner:
              def run(self, inputs, model='synthia'):
                  t0=time.time(); s=_load(model); name=s.get_inputs()[0].name
                  x=np.array(inputs if isinstance(inputs,list) else list(inputs.values()),dtype=np.float32)
                  if x.ndim==1: x=x[None,:]
                  out=s.run(None,{name:x})
                  return {'outputs':[o.tolist() for o in out],'model':model,'latency_ms':round((time.time()-t0)*1000,2)}
          runner=ONNXRunner()
          EOF


          from fastapi import FastAPI
          from fastapi.middleware.cors import CORSMiddleware
          from contextlib import asynccontextmanager
          from routers import inference, field, oracle, trident, mesh as mesh_router
          from routers.collapse import router as collapse_router
          from routers.proximity import router as proximity_router
          from core.mesh import get_mesh
          from core.gate_ops import load as load_gates
          import os

          @asynccontextmanager
          async def lifespan(app):
              gates = load_gates()
              print(f'[synthia-python] {len(gates)} gates loaded')
              m = get_mesh()
              m.start_pulse(interval_s=5.0)
              print(f'[synthia-python] mesh online node={m.node_id} session={m.session_id}')
              yield
              m.stop_pulse()

          app = FastAPI(title='synthia-python', version='2.0.0', lifespan=lifespan)
          app.add_middleware(CORSMiddleware, allow_origins=['*'], allow_methods=['*'], allow_headers=['*'])
          app.include_router(inference.router)
          app.include_router(field.router)
          app.include_router(oracle.router)
          app.include_router(trident.router)
          app.include_router(mesh_router.router)
          app.include_router(collapse_router)
          app.include_router(proximity_router)

          @app.get('/health')
          def health():
              from core.gate_ops import _gates, _emergence_state
              m = get_mesh()
              peers = m.status()['peers']
              return {'status':'ok','service':'synthia-python','node_id':m.node_id,
                  'session':m.session_id,'peers':len(peers),
                  'healthy_peers':sum(1 for p in peers if p['healthy']),
                  'gates_loaded':len(_gates),
                  'active_patterns':sum(1 for s in _emergence_state.values() if s.get('frequency',0)>0.3)}
          EOF


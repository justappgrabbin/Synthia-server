          from fastapi import APIRouter, HTTPException
          from pydantic import BaseModel
          from typing import Optional
          router = APIRouter()
          _store = None
          def get_store():
              global _store
              if _store is None:
                  try:
                      from core.trident.rag import RAGStore
                      _store = RAGStore()
                  except ImportError: raise RuntimeError('Drop model.py + rag.py from stellarproximology/Trident into trident/core/trident/')
              return _store
          class ChunkRequest(BaseModel):
              text: str; meta: Optional[dict]={}
          class QueryRequest(BaseModel):
              query: str; top_k: Optional[int]=5; head: Optional[str]=None
          @router.post('/trident/add')
          async def add_chunk(req: ChunkRequest):
              try: return {'chunk_id': get_store().add(req.text,meta=req.meta),'status':'added'}
              except Exception as e: raise HTTPException(500,str(e))
          @router.post('/trident/query')
          async def query(req: QueryRequest):
              try: return {'results': get_store().search(req.query,top_k=req.top_k),'head':req.head}
              except Exception as e: raise HTTPException(500,str(e))
          @router.get('/trident/chunks')
          async def list_chunks():
              try: return {'chunks': get_store().list()}
              except Exception as e: raise HTTPException(500,str(e))
          EOF


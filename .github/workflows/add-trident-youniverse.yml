name: Add Trident and you-n-i-verse Layers

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch name to create/update with integration files
        required: false
        default: integrate-trident-youniverse
      open_pr:
        description: Open a pull request after committing changes
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  add-layers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create integration branch
        run: |
          BRANCH="${{ github.event.inputs.branch_name }}"
          git checkout -B "$BRANCH"

      - name: Create target directories
        run: |
          mkdir -p trident
          mkdir -p server/you-n-i-verse/routers
          mkdir -p server/you-n-i-verse/scripts
          mkdir -p shared
          mkdir -p client/src/hooks
          mkdir -p client/src/pages
          mkdir -p docs

      - name: Add Trident MCP scaffold
        run: |
          cat > trident/README.md <<'EOF'
          # TRIDENT — 3-Head Tiny LM + P2P RAG + MCP

          Three specialist heads: code, math, research.

          This directory is reserved for the Python Trident stack:
          - `mcp_server.py`
          - `model.py`
          - `rag.py`
          - `signal_server.py`
          - `rag_client.js`
          - `requirements.txt`

          Add the source files from the uploaded Trident bundle, then run:

          ```bash
          pip install -r trident/requirements.txt
          python trident/model.py
          python trident/mcp_server.py
          ```
          EOF

          cat > trident/requirements.txt <<'EOF'
          torch>=2.0.0
          websockets>=12.0
          mcp[cli]>=1.0.0
          aiortc>=1.6.0
          numpy>=1.24.0
          fastapi>=0.110
          uvicorn[standard]>=0.27
          EOF

          cat > trident/mcp_config.json <<'EOF'
          {
            "mcpServers": {
              "trident": {
                "command": "python",
                "args": ["trident/mcp_server.py"],
                "cwd": ".",
                "description": "TRIDENT 3-head LM with P2P RAG"
              }
            }
          }
          EOF

      - name: Add you-n-i-verse integration scaffold
        run: |
          cat > docs/YOU-N-I-VERSE-INTEGRATION.md <<'EOF'
          # you-n-i-verse Integration Plan

          This repository keeps three layers separate:

          1. Current Synthia server runtime
          2. you-n-i-verse substrate layer
          3. Trident MCP / three-head model layer

          ## Intended layout

          ```text
          server/you-n-i-verse/
            index.ts
            db.ts
            websocket.ts
            websocket-init.ts
            routers.ts
            routers/hexagram.ts
            routers/broadcast.ts
            routers/actionlog.ts
            routers/agent.ts
            routers/knowledge.ts
            scripts/init-roots.mjs

          shared/hexagram-codon-map.ts

          client/src/hooks/useWebSocket.ts
          client/src/pages/AdminPanel.tsx
          client/src/pages/ReceivingSide.tsx

          trident/
            mcp_server.py
            model.py
            rag.py
            signal_server.py
            rag_client.js
            requirements.txt
          ```

          ## Runtime split

          - Synthia server remains the production Express service.
          - you-n-i-verse adds hexagram/codon addressing, roots, broadcasts, mesh, and action logging.
          - Trident MCP exposes code/math/research heads to Claude or any MCP client.

          Do not blindly replace `server/index.js`; mount or migrate deliberately.
          EOF

          cat > server/you-n-i-verse/README.md <<'EOF'
          # you-n-i-verse Layer

          Place the uploaded TypeScript substrate files here.

          This layer contains:
          - tRPC routers
          - websocket mesh
          - Drizzle database helpers
          - root initialization
          - hexagram/codon addressing integration
          EOF

      - name: Add workflow manifest
        run: |
          cat > INTEGRATION_MANIFEST.md <<'EOF'
          # Integration Manifest

          This branch was generated by `.github/workflows/add-trident-youniverse.yml`.

          ## Added

          - `.github/workflows/add-trident-youniverse.yml`
          - `trident/README.md`
          - `trident/requirements.txt`
          - `trident/mcp_config.json`
          - `server/you-n-i-verse/README.md`
          - `docs/YOU-N-I-VERSE-INTEGRATION.md`

          ## Manual source files still needed

          Upload/copy the actual source files into the paths listed in `docs/YOU-N-I-VERSE-INTEGRATION.md`.
          This workflow intentionally adds scaffolding first so the current production server is not broken by a blind merge.
          EOF

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git add .
            git commit -m "Add Trident and you-n-i-verse integration scaffold"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push --set-upstream origin "${{ github.event.inputs.branch_name }}" --force-with-lease

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true' && github.event.inputs.open_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.event.inputs.branch_name }}" \
            --title "Add Trident and you-n-i-verse integration scaffold" \
            --body "Adds a safe scaffold for the Trident MCP layer and you-n-i-verse substrate layer without overwriting the current production server entrypoint."

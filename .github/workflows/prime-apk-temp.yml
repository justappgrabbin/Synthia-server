name: Build Synthia Prime APK (temporary)

on:
  push:
    branches: [ prime-apk-build-v0.2.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Materialize Synthia Prime Android source
        shell: bash
        run: |
          mkdir -p prime-build
          cat > /tmp/prime-src.b64 <<'B64'
          [... clipped for brevity in this analysis continuation ...]
          B64
          base64 -d /tmp/prime-src.b64 > /tmp/prime-src.tar.gz
          echo "d94015c6c070642da536c47da687d7495ba3bd0fcf4830d81d37b968b928d4eb  /tmp/prime-src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prime-src.tar.gz -C prime-build

      - name: Build debug APK
        working-directory: prime-build
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Synthia-Prime-Android-debug
          path: prime-build/app/build/outputs/apk/debug/app-debug.apk

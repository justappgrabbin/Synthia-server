name: Resonance signaling check

on:
  push:
    branches:
      - resonance-p2p-signal-2026-10-02
  pull_request:
    paths:
      - server/lite.js
      - test/resonance-signal.test.js
      - .github/workflows/resonance-signal-check.yml

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server/lite.js
      - run: node test/resonance-signal.test.js

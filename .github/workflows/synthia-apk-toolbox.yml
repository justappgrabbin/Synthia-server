name: Synthia APK Toolbox

on:
  push:
    branches:
      - synthia-apk-toolbox-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-toolbox:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current Acode normal APK and APK tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolbox
          curl -fL --retry 3 -o toolbox/app-normal-v1.13.3.apk https://github.com/Acode-Foundation/Acode/releases/download/v1.13.3/app-normal.apk
          curl -fL --retry 3 -o toolbox/apktool_3.0.3.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -fL --retry 3 -o toolbox/uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          sha256sum toolbox/* | tee toolbox/SHA256SUMS.txt
      - name: Upload toolbox
        uses: actions/upload-artifact@v4
        with:
          name: synthia-apk-toolbox
          path: toolbox/
          if-no-files-found: error
          retention-days: 1

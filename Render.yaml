render.yaml
services:
  - type: web
    name: synthia-node
    runtime: node
    rootDir: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PYTHON_SERVICE_URL
        value: https://synthia-python.onrender.com
      - key: PORT
        fromService:
          type: web
          name: synthia-python
          property: port

  - type: web
    name: synthia-python
    runtime: python
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

services:
  - type: web
    name: synthia-server
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt --no-cache-dir
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: ./data
      - key: GROQ_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

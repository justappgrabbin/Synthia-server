services:
  - type: web
    name: synthia-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_KEY
        sync: false
      - key: SUPABASE_PRIMARY_URL
        sync: false
      - key: SUPABASE_PRIMARY_KEY
        sync: false
      - key: SUPABASE_SECONDARY_URL
        sync: false
      - key: SUPABASE_SECONDARY_KEY
        sync: false
